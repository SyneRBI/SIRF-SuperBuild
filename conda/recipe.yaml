# Usage:
#   rattler-build build -r conda -c conda-forge -c ismrmrd -c ccpi -c synerbi --channel-priority disabled [--no-build-id] [--test skip] [--variant python={3.11,3.12,...}] [-c nvidia --variant cuda_compiler_version={12.9,13.4}] [--target-platform {linux-64,osx-arm64,win-64}]
#
# Example (CPU, Python 3.13):
#   rattler-build build -r conda -c conda-forge -c ismrmrd -c ccpi -c synerbi --channel-priority disabled --no-build-id --test skip --variant python=3.13
#
# Notes:
# - --no-build-id: needed for ccache (env defaults CCACHE_DIR='', CCACHE_MAXSIZE=5G)
# - conda-forge::stir==6.4.0 forces the rest of the stack up (ITK 5.4.7, ROOT 6.36.10, Boost 1.90, hdf5 1.14.6), which also unifies everything on icu 78
#
# Channel includes:
# - ismrmrd::mrd-storage-server (gadgetron run dep; linux-64 only)
# - ccpi::cil (sirf run dep on linux/win; run-constrained on osx — no CIL 26 for osx)
# - synerbi::gadgetron

schema_version: 1

context:
  # pet-rd-tools==2.2.0 needs boost==1.90
  # stir==6.4.0 needs boost>=1.90
  boost: 1.90.0.*
  # gadgetron & stir need hdf5==1.14.6
  hdf5: 1.14.6
  sirf_contribs: 3.10.0
  # example-data install prefix (share/SIRF-<minor>/data); must match SIRF project() MAJOR.MINOR
  sirf_minor: 3.10
  sirf_tests_slow: ${{ env.get('SIRF_TESTS_SLOW', default='false') }}
  cuda_version: ${{ cuda_compiler_version if cuda_compiler_version is defined and cuda_compiler_version != "None" else "None" }}
  with_cuda: ${{ "true" if cuda_version != "None" else "" }}
  cuda_major: ${{ (cuda_version | split(".") | first) if with_cuda else "0" }}
  cuda_build_prefix: ${{ "cuda" ~ (cuda_version | version_to_buildstring) if with_cuda else "cpu" }}
  c_cache_c: ${{ env.get("CMAKE_C_COMPILER_LAUNCHER", default="ccache") }}
  c_cache_cxx: ${{ env.get("CMAKE_CXX_COMPILER_LAUNCHER", default="ccache") }}
  ccache_dir: ${{ env.get("CCACHE_DIR", default="") }}
  ccache_maxsize: ${{ env.get("CCACHE_MAXSIZE", default="5G") }}

about:
  license: Apache-2.0
  license_family: Apache
  homepage: https://github.com/SyneRBI/SIRF-SuperBuild
  repository: https://github.com/SyneRBI/SIRF-SuperBuild

outputs:
  - package:
      name: ismrmrd
      version: "1.15.0"
    inherit: null
    source:
      git: https://github.com/ismrmrd/ismrmrd.git
      tag: v1.15.0
    build:
      number: 0
      # conda-forge STIR 6.4.0 needs Boost 1.90
      # but no compatible conda-forge ismrmrd exists
      script:
        content:
          - if: unix
            then: cmake -G Ninja $SRC_DIR -B $BUILD_PREFIX/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PREFIX -DCMAKE_PREFIX_PATH=$PREFIX -DBUILD_STATIC:BOOL=OFF -DBUILD_TESTS:BOOL=OFF -DBUILD_UTILITIES:BOOL=OFF -DBUILD_EXAMPLES:BOOL=OFF
            else: cmake -G Ninja "%SRC_DIR%" -B "%BUILD_PREFIX%/build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="%LIBRARY_PREFIX%" -DCMAKE_PREFIX_PATH="%LIBRARY_PREFIX%" -DBUILD_STATIC:BOOL=OFF -DBUILD_TESTS:BOOL=OFF -DBUILD_UTILITIES:BOOL=OFF -DBUILD_EXAMPLES:BOOL=OFF
          - if: unix
            then: cmake --build $BUILD_PREFIX/build --config Release
            else: cmake --build "%BUILD_PREFIX%/build" --config Release
          - if: unix
            then: cmake --install $BUILD_PREFIX/build --config Release
            else: cmake --install "%BUILD_PREFIX%/build" --config Release
        env:
          CMAKE_C_COMPILER_LAUNCHER: ${{ c_cache_c }}
          CMAKE_CXX_COMPILER_LAUNCHER: ${{ c_cache_cxx }}
          CCACHE_DIR: ${{ ccache_dir }}
          CCACHE_MAXSIZE: ${{ ccache_maxsize }}
    requirements:
      build:
        - ccache
        - cmake
        - ninja
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
      host:
        - fftw
        - hdf5 ==${{ hdf5 }}
        - libboost-devel ${{ boost }}
        - nlohmann_json
        - pugixml
    tests:
      - script:
          - if: unix
            then: test -f $PREFIX/lib/cmake/ISMRMRD/ISMRMRDConfig.cmake
            else: if not exist "%LIBRARY_PREFIX%\lib\cmake\ISMRMRD\ISMRMRDConfig.cmake" exit 1
    about:
      summary: "ISMRMRD data format library"
      homepage: https://github.com/ismrmrd/ismrmrd
      license: LicenseRef-ISMRMRD
      license_file: LICENSE
      repository: https://github.com/ismrmrd/ismrmrd

  - package:
      name: siemens_to_ismrmrd
      version: "1.3.0"
    inherit: null
    source:
      git: https://github.com/ismrmrd/siemens_to_ismrmrd.git
      tag: v1.3.0
      patches:
        # boost::system is header-only, but
        # conda-forge boost=1.90 ships no boost_system CMake component config (fixed in 1.92).
        # drop the `system` component; nothing here needs it:
        - siemens_to_ismrmrd-drop-boost-system.patch
    build:
      number: 0
      script:
        content:
          - if: unix
            then: cmake -G Ninja $SRC_DIR -B $BUILD_PREFIX/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PREFIX -DBUILD_DYNAMIC:BOOL=ON
            else: cmake -G Ninja "%SRC_DIR%" -B "%BUILD_PREFIX%/build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="%LIBRARY_PREFIX%" -DBUILD_DYNAMIC:BOOL=ON
          - if: unix
            then: cmake --build $BUILD_PREFIX/build --config Release
            else: cmake --build "%BUILD_PREFIX%/build" --config Release
          - if: unix
            then: cmake --install $BUILD_PREFIX/build --config Release
            else: cmake --install "%BUILD_PREFIX%/build" --config Release
        env:
          CMAKE_C_COMPILER_LAUNCHER: ${{ c_cache_c }}
          CMAKE_CXX_COMPILER_LAUNCHER: ${{ c_cache_cxx }}
          CCACHE_DIR: ${{ ccache_dir }}
          CCACHE_MAXSIZE: ${{ ccache_maxsize }}
    requirements:
      build:
        - ccache
        - cmake
        - ninja
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
      host:
        - ${{ pin_subpackage('ismrmrd', exact=True) }}
        - libboost-devel ${{ boost }}
        - libxml2-devel
        - libxslt
      run:
        - ${{ pin_subpackage('ismrmrd') }}
    tests:
      - script:
          - siemens_to_ismrmrd --help
          - ismrmrd_to_siemens --help
    about:
      summary: "Siemens MR-PET raw data to ISMRMRD converter"
      homepage: https://github.com/ismrmrd/siemens_to_ismrmrd
      license: LicenseRef-siemens-to-ismrmrd
      license_file: LICENSE
      repository: https://github.com/ismrmrd/siemens_to_ismrmrd

  - package:
      name: sirf-data
      version: "3.10.1"
    inherit: null
    source:
      git: https://github.com/SyneRBI/SIRF_data.git
      # from SyneRBI/SIRF:/data submodule
      rev: 8bf9b6d1f5da6d4da7cdc5d30ac80414aa1cbe69
    build:
      number: 0
      noarch: generic
      script:
        interpreter: ${{ "powershell" if win else "bash" }}
        content:
          - if: unix
            then: |
              mkdir -p "$PREFIX/share/SIRF-${{ sirf_minor }}/data"
              cp -r "$SRC_DIR/." "$PREFIX/share/SIRF-${{ sirf_minor }}/data/"
              rm -rf "$PREFIX/share/SIRF-${{ sirf_minor }}/data/.git"
            else: |
              New-Item -ItemType Directory -Force "$env:PREFIX\share\SIRF-${{ sirf_minor }}\data" | Out-Null
              Copy-Item -Recurse -Force "$env:SRC_DIR\*" "$env:PREFIX\share\SIRF-${{ sirf_minor }}\data\"
              Remove-Item -Recurse -Force "$env:PREFIX\share\SIRF-${{ sirf_minor }}\data\.git" -ErrorAction SilentlyContinue
    about:
      summary: SIRF example data (MR/PET/Registration/SPECT)
      homepage: https://github.com/CCPPETMR/SIRF_data
      repository: https://github.com/CCPPETMR/SIRF_data
      license: Apache-2.0

  - package:
      name: sirf
      version: "3.10.1"
    source:
      git: https://github.com/SyneRBI/SIRF.git
      # from SyneRBI/SIRF#1420
      rev: 5f971e755015abcbf2b1bf335d5f5264031f2b8b
    build:
      number: 0
      string: py${{ python | replace('.', '') }}${{ '_' ~ cuda_build_prefix if with_cuda else '' }}
      variant:
        use_keys:
          - ${{ "cuda" if with_cuda }}
        down_prioritize_variant: ${{ 0 if with_cuda else 1 }}
      script:
        file: ${{ "build-sirf.sh" if unix else "build-sirf.ps1" }}
        env:
          cuda_compiler_version: ${{ cuda_version }}
          GADGETRON_USE_CUDA: ${{ 'ON' if with_cuda else 'OFF' }}
          CMAKE_C_COMPILER_LAUNCHER: ${{ c_cache_c }}
          CMAKE_CXX_COMPILER_LAUNCHER: ${{ c_cache_cxx }}
          CCACHE_DIR: ${{ ccache_dir }}
          CCACHE_MAXSIZE: ${{ ccache_maxsize }}
          SIRF_CONTRIBS_VERSION: ${{ sirf_contribs }}
    requirements:
      build:
        - ccache
        - cmake
        - git
        - ninja
        - pip
        - swig
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - if: with_cuda
          then: ${{ compiler('cuda') }}
      host:
        - gadgetron 4.7.2.* ${{ cuda_build_prefix }}*
        - stir 6.4.0.* ${{ cuda_build_prefix }}*
        - libboost-devel ${{ boost }}
        - fftw
        - hdf5 ==${{ hdf5 }}
        - ${{ pin_subpackage('ismrmrd', exact=True) }}
        - niftyreg
        - if: osx
          then: libpng  # see build-sirf.sh
        - numpy ~=2
        - pip
        - python
        - setuptools
        - if: with_cuda
          then:
            - cuda-version ==${{ cuda_version }}
            - if: (cuda_major | int) >= 12
              then: cuda-cudart-dev
            - libcublas-dev
            - libcufft-dev
            - libcusparse-dev
      run:
        - array-api-compat
        # ccpi::cil has no osx builds
        - if: not osx
          then: cil >=26
        - gadgetron 4.7.2.* ${{ cuda_build_prefix }}*
        - pet-rd-tools
        - stir 6.4.0.* ${{ cuda_build_prefix }}*
        - deprecation
        - ${{ pin_subpackage('ismrmrd') }}
        - niftyreg
        - if: osx
          then: libpng  # see build-sirf.sh
        - numpy ~=2
        - pip
        - python
        - if: with_cuda
          then:
            - __cuda
            - cuda-version ~=${{ cuda_version }}
            - cuda-cudart
            - libcublas
            - libcufft
            - libcusparse
            - libcurand
            - ccpi-regulariser >=26 cuda${{ cuda_major }}*
      run_constraints:
        - ${{ pin_subpackage('siemens_to_ismrmrd') }}
        - ${{ pin_subpackage('sirf-data') }}
        - sirf-contrib ${{ sirf_contribs }}.*
        # ccpi::cil has no osx builds
        - if: osx
          then: cil >=26
    tests:
      - python:
          imports:
            - sirf
            - sirf.Utilities
            - if: not osx
              then:
                - sirf.STIR
                - sirf.Reg
                - sirf.SIRF
            - if: linux
              then: sirf.Gadgetron
      - requirements:
          run:
            - ${{ pin_subpackage('sirf-data') }}
            - pytest
            - pytest-cov
            - docopt
            - matplotlib
        files:
          source:
            - src/Synergistic/pSyn/tests/
            - src/Synergistic/tests/test_pSynergistic.py
            - src/Registration/pReg/tests/
            - src/xSTIR/pSTIR/tests/
            - examples/parameter_files/
            - examples/Python/PET/
            - src/torch/tests/
            - src/xGadgetron/pGadgetron/tests/
            - examples/Python/MR/
        script:
          interpreter: ${{ "powershell" if win else "bash" }}
          content:
            - python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
            - if: unix
              then: |
                export SIRF_DATA_PATH="$PREFIX/share/SIRF-${{ sirf_minor }}/data"
                mkdir -p "$SIRF_DATA_PATH/examples/MR/zenodo"
              else: |
                $env:SIRF_DATA_PATH = "$env:PREFIX\share\SIRF-${{ sirf_minor }}\data"
                New-Item -ItemType Directory -Force "$env:SIRF_DATA_PATH\examples\MR\zenodo" | Out-Null
            # zenodo_retry
            - |
              python -c "import os, time, urllib.request as u
              if '${{ sirf_tests_slow }}' == 'false':
                  print('skipping zenodo fetch (SIRF_TESTS_SLOW unset)')
                  raise SystemExit
              b = os.environ['SIRF_DATA_PATH']
              f = {'SIRF_recon.h5': 'https://zenodo.org/record/3571228/files/SIRF_recon.h5?download=1',
                   'dicom_as_nifti.nii': 'https://zenodo.org/record/3571228/files/dicom_as_nifti.nii?download=1',
                   '3D_RPE_Lowres.h5': 'https://zenodo.org/record/4600937/files/3DRPE_Lowres.h5?download=1'}
              def get(url, dst):
                  for a in range(5):
                      try:
                          u.urlretrieve(url, dst); return
                      except Exception:
                          if a == 4: raise
                          time.sleep(5)
              for z in (os.path.join(b, 'examples', 'MR', 'zenodo'), os.path.join(b, 'zenodo')):
                  os.makedirs(z, exist_ok=True)
                  for n, url in f.items():
                      dst = os.path.join(z, n)
                      if not os.path.exists(dst):
                          get(url, dst)
              print('fetched zenodo MR test data under', b)"
            # gadgetron requires mrd-storage-server (currently missing on osx-arm64 & win-64)
            - if: unix
              then: |
                gadgetron_pid=''
                if [ -x "$PREFIX/bin/mrd-storage-server" ]; then
                  export GADGETRON_HOME="$PREFIX"  # relay config lookup, cf. activate-sirf.sh
                  "$PREFIX/bin/gadgetron" > gadgetron.log 2>&1 &
                  gadgetron_pid=$!
                  # wait for the relay port (up to 60s)
                  for i in $(seq 1 60); do
                    (exec 3<>/dev/tcp/127.0.0.1/9002) 2>/dev/null && { exec 3>&-; break; }
                    sleep 1
                  done
                fi
              else: |
                if (Test-Path "$env:PREFIX\Library\bin\mrd-storage-server.exe") {
                  $env:GADGETRON_HOME = $env:PREFIX  # relay config lookup, cf. sirf-activate.bat
                  $gadgetron = Start-Process -FilePath "$env:PREFIX\Library\bin\gadgetron.exe" -RedirectStandardOutput gadgetron.log -PassThru
                  # wait for the relay port (up to 60s)
                  $c = New-Object Net.Sockets.TcpClient
                  for ($i = 0; $i -lt 60; $i++) {
                    try { $c.Connect("127.0.0.1", 9002); $c.Close(); break } catch { Start-Sleep -Seconds 1 }
                  }
                }
            # manually accumulate (pytest cannot accumulate due to same-basename import collisions & C++ segfault under --import-mode=importlib)
            - if: unix
              then: |
                ret=0
                suites=(src/Synergistic/pSyn/tests src/Registration/pReg/tests src/xSTIR/pSTIR/tests)
                # mrd-storage-server tests
                [ -x "$PREFIX/bin/mrd-storage-server" ] && suites+=(src/xGadgetron/pGadgetron/tests examples/Python/MR src/Synergistic/tests/test_pSynergistic.py)
                # torch autograd tests crash (SIGABRT) on non-linux
                [ "$(uname -s)" = "Linux" ] && suites+=(src/torch/tests)
                # slow (examples/Python/PET, noncartesian examples, test_nifti_image_data_3d)
                [ ${{ sirf_tests_slow }} != false ] && suites+=(examples/Python/PET)
                kexpr=''
                if [ ${{ sirf_tests_slow }} == false ]; then
                  kexpr='not test_nifti_image_data_3d and not noncartesian'
                elif [ "$(uname -s)" = "Darwin" ]; then
                  # STIR NIfTI IO missing on osx-arm64
                  kexpr='not test_nifti_image_data_3d'
                fi
                extra_args=()
                [ -n "$kexpr" ] && extra_args+=(-k "$kexpr")
                for d in "${suites[@]}"; do
                  echo "=== pytest: $d ==="
                  rc=0
                  python -m pytest "${extra_args[@]}" "$d" || rc=$?
                  # a non-zero exit is a failure unless it's NO_TESTS_RAN (5),
                  # e.g. a suite where every test was deselected on this platform
                  if [ "$rc" -ne 0 ] && [ "$rc" -ne 5 ]; then ret=1; fi
                done
              else: |
                # A non-zero native exit (e.g. pytest's NO_TESTS_RAN=5) must not become a
                # terminating NativeCommandExitException (pwsh >= 7.3); inspect $LASTEXITCODE.
                if (Get-Variable PSNativeCommandUseErrorActionPreference -ErrorAction SilentlyContinue) {
                  $PSNativeCommandUseErrorActionPreference = $false
                }
                $ret = 0
                $suites = @('src/Synergistic/pSyn/tests', 'src/Registration/pReg/tests', 'src/xSTIR/pSTIR/tests')
                # mrd-storage-server tests
                if (Test-Path "$env:PREFIX\Library\bin\mrd-storage-server.exe") { $suites += @('src/xGadgetron/pGadgetron/tests', 'examples/Python/MR', 'src/Synergistic/tests/test_pSynergistic.py') }
                # torch autograd tests crash (SIGABRT) on non-linux
                # skip nifti tests (need mrd-storage-server)
                $kexpr = 'not test_nifti_image_data_3d'
                # slow (examples/Python/PET, noncartesian examples)
                if ('${{ sirf_tests_slow }}' -ne 'true') {
                  $kexpr += ' and not noncartesian'
                } else {
                  $suites += @('examples/Python/PET')
                }
                $kargs = @('-k', $kexpr)
                foreach ($d in $suites) {
                  Write-Host "=== pytest: $d ==="
                  $code = 1
                  try {
                    python -m pytest @kargs $d
                    $code = $LASTEXITCODE
                  } catch {
                    # a non-zero native exit may surface as a NativeCommandExitException (pwsh >= 7.3)
                    $ex = $_.Exception
                    $ep = $ex.PSObject.Properties['ExitCode']
                    if ($null -ne $ep -and $null -ne $ep.Value) { $code = [int]$ep.Value }
                    elseif ("$($ex.Message)" -match 'ended with non-zero exit code: (\d+)') { $code = [int]$Matches[1] }
                    else { Write-Host "pytest error for $d : $($ex.Message)" }
                  }
                  # a non-zero exit is a failure unless NO_TESTS_RAN (5)
                  if ($code -ne 0 -and $code -ne 5) { $ret = 1 }
                }
            - if: unix
              then: kill "$gadgetron_pid" 2>/dev/null || true
              else: if ($gadgetron) { Stop-Process -Id $gadgetron.Id -Force -ErrorAction SilentlyContinue }
            - if: unix
              then: |
                if [ "$ret" -ne 0 ]; then
                  echo "----------- Last 40 lines of gadgetron.log (relay)"
                  tail -n 40 gadgetron.log 2>/dev/null || true
                fi
                exit "$ret"
              else: |
                if ($ret -ne 0) {
                  Write-Host "----------- Last 40 lines of gadgetron.log (relay)"
                  Get-Content gadgetron.log -Tail 40 -ErrorAction SilentlyContinue
                }
                exit $ret
      - script:
          interpreter: bash
          content:
            - if: linux
              then: |
                set -uxo pipefail
                # $PREFIX and sirf.__file__ return a literal placeholder (not a real
                # path) in the rattler-build test env. Locate the sirf-data package's
                # data dir by searching the filesystem instead.
                SIRF_VER="SIRF-${{ sirf_minor }}"
                DATA_DIR=$(find "$(dirname "$PWD")" / -maxdepth 14 -type d -path "*/share/$SIRF_VER/data" 2>/dev/null | head -1 || true)
                if [ -z "$DATA_DIR" ]; then
                  echo "ERROR: SIRF data dir (share/$SIRF_VER/data) not found"
                  exit 1
                fi
                export SIRF_DATA_PATH="$DATA_DIR"
                export GADGETRON_HOME="$(dirname "$(dirname "$(dirname "$DATA_DIR")")")"  # <prefix>
                echo "SIRF_DATA_PATH=$DATA_DIR"
                ls "$DATA_DIR/examples/PET" | head -3
                mkdir cil_sirf_test
                touch cil_sirf_test/__init__.py
                DEFAULT_CIL_TAG=$(python -c 'import cil; ch = cil.version.commit_hash; print(ch if ch else "v" + cil.version.version)' | tail -n1)
                for fname in test_SIRF.py utils.py testclass.py; do
                  curl -fsSL "https://raw.githubusercontent.com/TomographicImaging/CIL/$DEFAULT_CIL_TAG/Wrappers/Python/test/$fname" > "cil_sirf_test/$fname"
                done
                "$PREFIX/bin/gadgetron" > gadgetron.log 2>&1 &
                gadgetron_pid=$!
                # wait for the relay port (up to 60s)
                for i in $(seq 1 60); do
                  (exec 3<>/dev/tcp/127.0.0.1/9002) 2>/dev/null && { exec 3>&-; break; }
                  sleep 1
                done
                python -m unittest discover -v ./cil_sirf_test
                ret=$?
                kill -n 15 "$gadgetron_pid" 2>/dev/null || true
                exit "$ret"
    about:
      summary: Synergistic Image Reconstruction Framework
      homepage: https://github.com/SyneRBI/SIRF
      repository: https://github.com/SyneRBI/SIRF
      license: Apache-2.0
      license_file: LICENSE.txt
  - package:
      name: sirf-contrib
      version: ${{ sirf_contribs }}
    inherit: null
    source:
      git: https://github.com/SyneRBI/SIRF-Contribs.git
      tag: v${{ sirf_contribs }}
    build:
      number: 0
      noarch: python
      script:
        content:
          - ${{ PYTHON }} -m pip install . -vv --no-deps
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ sirf_contribs }}
    requirements:
      host:
        - python
        - pip
        - setuptools
        - setuptools-scm
      run:
        - sirf 3.10.1.* # noarch but depends on platform, so build-string (pin_subpackage) would be too tight
        - numpy ~=2
        - scipy
        - matplotlib
        - docopt
        - array-api-compat
        - brainweb
    tests:
      - python:
          imports:
            - sirf
            - sirf.contrib
          pip_check: true
    about:
      summary: SIRF contributions (sirf.contrib)
      homepage: https://github.com/SyneRBI/SIRF-Contribs
      repository: https://github.com/SyneRBI/SIRF-Contribs
      license: Apache-2.0
