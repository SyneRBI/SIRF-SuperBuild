# Usage:
#   rattler-build build -r conda -c conda-forge -c ismrmrd -c ccpi --target-platform linux-64 [--variant python=3.12]
# Channel includes:
# - ismrmrd::mrd-storage-server (gadgetron run dep)
# - ccpi::cil
# cuda: CONDA_OVERRIDE_CUDA={12.9,13.0,...} rattler-build -c nvidia ...
# TODO:
# - [ ] conda-forge::sirf
# - [ ] conda-forge::gadgetron?
# - [ ] conda-forge::pet-rd-tools
#
# STIR 6.4.0 is consumed from conda-forge;
# forcing the rest of the stack up (ITK 5.4.7, ROOT 6.36.10,
# Boost 1.90, hdf5 1.14.6), which also unifies everything on icu 78. ismrmrd is
# built from source here because conda-forge has no pre-built ismrmrd for Boost 1.90.

schema_version: 1

context:
  boost: 1.92.0.*
  hdf5: 1.14.6
  cuda_version: ${{ cuda_compiler_version if cuda_compiler_version is defined and cuda_compiler_version != "None" else "None" }}
  with_cuda: ${{ "true" if cuda_version != "None" else "" }}
  cuda_major: ${{ (cuda_version | split(".") | first) if with_cuda else "0" }}
  cuda_build_prefix: ${{ "cuda" ~ (cuda_version | version_to_buildstring) if with_cuda else "cpu" }}
  c_cache_c: ${{ env.get("CMAKE_C_COMPILER_LAUNCHER", default="ccache") }}
  c_cache_cxx: ${{ env.get("CMAKE_CXX_COMPILER_LAUNCHER", default="ccache") }}
  ccache_dir: ${{ env.get("CCACHE_DIR", default="") }}
  ccache_maxsize: ${{ env.get("CCACHE_MAXSIZE", default="5G") }}

about:
  license: Apache-2.0
  license_family: Apache
  homepage: https://github.com/SyneRBI/SIRF-SuperBuild
  repository: https://github.com/SyneRBI/SIRF-SuperBuild

outputs:
  - package:
      name: ismrmrd
      version: "1.15.0"
    inherit: null
    source:
      git: https://github.com/ismrmrd/ismrmrd.git
      tag: v1.15.0
    build:
      number: 0
      # conda-forge STIR 6.4.0 needs Boost 1.90
      # but no compatible conda-forge ismrmrd exists
      script:
        content:
          - cmake -G Ninja $SRC_DIR -B $BUILD_PREFIX/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PREFIX -DCMAKE_PREFIX_PATH=$PREFIX -DBUILD_STATIC:BOOL=OFF -DBUILD_TESTS:BOOL=OFF -DBUILD_UTILITIES:BOOL=OFF -DBUILD_EXAMPLES:BOOL=OFF
          - cmake --build $BUILD_PREFIX/build --config Release
          - cmake --install $BUILD_PREFIX/build --config Release
        env:
          CMAKE_C_COMPILER_LAUNCHER: ${{ c_cache_c }}
          CMAKE_CXX_COMPILER_LAUNCHER: ${{ c_cache_cxx }}
          CCACHE_DIR: ${{ ccache_dir }}
          CCACHE_MAXSIZE: ${{ ccache_maxsize }}
    requirements:
      build:
        - ccache
        - cmake
        - ninja
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
      host:
        - fftw
        - hdf5 ==${{ hdf5 }}
        - libboost-devel ${{ boost }}
        - nlohmann_json
        - pugixml
      run:
        - fftw
        - hdf5 ~=${{ hdf5 }}
        - libboost-devel ${{ boost }}
        - pugixml
    tests:
      - script:
          - test -f $PREFIX/lib/cmake/ISMRMRD/ISMRMRDConfig.cmake
    about:
      summary: "ISMRMRD data format library"
      homepage: https://github.com/ismrmrd/ismrmrd
      license: LicenseRef-ISMRMRD
      license_file: LICENSE
      repository: https://github.com/ismrmrd/ismrmrd

  - package:
      name: gadgetron
      version: "4.7.2"
    source:
      git: https://github.com/SyneRBI/gadgetron.git
      # -Werror/cblas, boost>=1.90, CUDA BOOST_CURRENT_FUNCTION
      rev: ee6f8c8fc8fa88c1ff8ba809d3da597b83722799
    build:
      number: 0
      string: ${{ cuda_build_prefix }}
      variant:
        use_keys:
          - ${{ "cuda" if with_cuda }}
        down_prioritize_variant: ${{ 0 if with_cuda else 1 }}
      script:
        file: build-gadgetron.sh
        env:
          cuda_compiler_version: ${{ cuda_version }}
          USE_CUDA: ${{ 'ON' if with_cuda else 'OFF' }}
          CMAKE_C_COMPILER_LAUNCHER: ${{ c_cache_c }}
          CMAKE_CXX_COMPILER_LAUNCHER: ${{ c_cache_cxx }}
          CCACHE_DIR: ${{ ccache_dir }}
          CCACHE_MAXSIZE: ${{ ccache_maxsize }}
    requirements:
      build:
        - ccache
        - cmake
        - ninja
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - if: with_cuda
          then: ${{ compiler('cuda') }}
      host:
        # armadillo 12 (libar2) — Gadgetron 4.7 requires Armadillo 12+.
        - armadillo >=12,<13
        - libboost-devel ${{ boost }}
        - fftw
        - hdf5 ==${{ hdf5 }}
        - howardhinnant_date
        - ${{ pin_subpackage('ismrmrd', exact=True) }}
        # BLAS/LAPACK pinned to the netlib 3.11.0 builds (see comment in sirf).
        - libblas 3.11.0.* *_netlib
        - libcblas 3.11.0.* *_netlib
        - libcurl
        - libgomp
        - liblapack 3.11.0.* *_netlib
        - liblapacke 3.11.0.* *_netlib
        - nlohmann_json
        - pugixml
        - range-v3
        - if: with_cuda
          then:
            - cuda-version ==${{ cuda_version }}
            - if: (cuda_major | int) >= 12
              then: cuda-cudart-dev
            # GPU toolbox links the CUDA math libs; -dev ships the headers,
            # and each build pins its own cuda-version so the solver picks
            # the matching CUDA (e.g. libcufft 11.4 for 12.9).
            - libcublas-dev
            - libcufft-dev
            - libcusparse-dev
      run:
        - armadillo >=12,<13
        - libboost-devel ${{ boost }}
        - fftw
        - hdf5 ~=${{ hdf5 }}
        - howardhinnant_date
        - ${{ pin_subpackage('ismrmrd') }}
        - libblas 3.11.0.* *_netlib
        - libcblas 3.11.0.* *_netlib
        - libcurl
        - libgomp
        - liblapack 3.11.0.* *_netlib
        - liblapacke 3.11.0.* *_netlib
        - mrd-storage-server
        - nlohmann_json
        - pugixml
        - range-v3
        - if: with_cuda
          then:
            - __cuda
            - cuda-version ~=${{ cuda_version }}
            - cuda-cudart
            - libcublas
            - libcufft
            - libcusparse
            - libcurand
      ignore_run_exports:
        by_name:
          - if: with_cuda
            then:
              - cuda-version
              - cuda-cudart-dev
    tests:
      - script:
          - test -x $PREFIX/bin/gadgetron
          - test -x $PREFIX/bin/gadgetron_ismrmrd_client
          - test -f $PREFIX/lib/libgadgetron_core.so
    about:
      summary: "Gadgetron MR image reconstruction framework (CPU-only, SyneRBI fork)"
      # Custom “GADGETRON SOFTWARE LICENSE V1.0” (NIH public-domain-style), not Apache-2.0
      license: LicenseRef-GADGETRON
      license_file: LICENSE
      repository: https://github.com/SyneRBI/gadgetron

  - package:
      name: pet-rd-tools
      version: "2.0.2"
    source:
      git: https://github.com/UCL/pet-rd-tools.git
      tag: v2.0.2
    build:
      number: 0
      script:
        content:
          - cmake -G Ninja $SRC_DIR -B $BUILD_PREFIX/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PREFIX -DCMAKE_PREFIX_PATH=$PREFIX -DBUILD_TESTING:BOOL=OFF
          - cmake --build $BUILD_PREFIX/build --config Release
          - cmake --install $BUILD_PREFIX/build --config Release
        env:
          CMAKE_C_COMPILER_LAUNCHER: ${{ c_cache_c }}
          CMAKE_CXX_COMPILER_LAUNCHER: ${{ c_cache_cxx }}
          CCACHE_DIR: ${{ ccache_dir }}
          CCACHE_MAXSIZE: ${{ ccache_maxsize }}
    requirements:
      build:
        - ccache
        - cmake
        - ninja
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
      host:
        - libboost-devel ${{ boost }}
        - glog
        - libitk ==5.4.7
        - libitk-devel ==5.4.7
      run:
        - libboost-devel ${{ boost }}
        - glog
        - libitk ~=5.4.7
    tests:
      - script:
          - test -x $PREFIX/bin/nm_validate
    about:
      summary: "PET Raw Data (rd) tools"
      homepage: https://github.com/UCL/pet-rd-tools
      license: Apache-2.0
      license_file: LICENSE.txt
      repository: https://github.com/UCL/pet-rd-tools

  - package:
      name: sirf
      version: "3.10.1"
    source:
      git: https://github.com/SyneRBI/SIRF.git
      # Boost 1.90 asio fix + optional STIR-shim hook (SyneRBI/SIRF PR #1420, branch boost190-asio)
      rev: 502d8ecbb8a861578fc877c980a03407a2876e22
    build:
      number: 0
      string: py${{ python | replace('.', '') }}${{ '_' ~ cuda_build_prefix if with_cuda else '' }}
      variant:
        use_keys:
          - ${{ "cuda" if with_cuda }}
        down_prioritize_variant: ${{ 0 if with_cuda else 1 }}
      script:
        file: build-sirf.sh
        env:
          cuda_compiler_version: ${{ cuda_version }}
          GADGETRON_USE_CUDA: ${{ 'ON' if with_cuda else 'OFF' }}
          CMAKE_C_COMPILER_LAUNCHER: ${{ c_cache_c }}
          CMAKE_CXX_COMPILER_LAUNCHER: ${{ c_cache_cxx }}
          CCACHE_DIR: ${{ ccache_dir }}
          CCACHE_MAXSIZE: ${{ ccache_maxsize }}
    requirements:
      build:
        - ccache
        - cmake
        - git
        - ninja
        - pip
        - swig
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - if: with_cuda
          then: ${{ compiler('cuda') }}
      host:
        - ${{ pin_subpackage('gadgetron', exact=True) }}
        - ${{ pin_subpackage('pet-rd-tools', exact=True) }}
        - stir 6.4.0.* ${{ cuda_build_prefix }}*
        - libboost-devel ${{ boost }}
        - fftw
        - hdf5 ==${{ hdf5 }}
        - ${{ pin_subpackage('ismrmrd', exact=True) }}
        - niftyreg
        - numpy >=2
        - pip
        - python
        - setuptools  # pip runs without build isolation (see build-sirf.sh); the cpython-split python pkgs don't pull it in
        - if: with_cuda
          then:
            - cuda-version ==${{ cuda_version }}
            - if: (cuda_major | int) >= 12
              then: cuda-cudart-dev
            # cGadgetron links the CUDA math libs (headers via -dev).
            - libcublas-dev
            - libcufft-dev
            - libcusparse-dev
      run:
        - libboost-devel ${{ boost }}
        - array-api-compat
        - cil >=26  # calver so no upper bound
        - ${{ pin_subpackage('gadgetron') }}
        - ${{ pin_subpackage('pet-rd-tools') }}
        - stir 6.4.0.* ${{ cuda_build_prefix }}*
        - deprecation
        - fftw
        - hdf5 ~=${{ hdf5 }}
        - ${{ pin_subpackage('ismrmrd') }}
        - niftyreg
        - numpy >=2
        - pip
        - python
        - if: with_cuda
          then:
            - __cuda
            - cuda-version ~=${{ cuda_version }}
            - cuda-cudart
            - libcublas
            - libcufft
            - libcusparse
            - libcurand
            # CUDA regulariser (the GPU CIL) for the GPU variant.
            - ccpi-regulariser >=26 cuda${{ cuda_major }}*
      ignore_run_exports:
        by_name:
          - if: with_cuda
            then:
              - cuda-version
              - cuda-cudart-dev
    tests:
      - python:
          imports:
            - sirf
            - sirf.contrib
            - sirf.STIR
            - sirf.Gadgetron
            - sirf.Utilities
            - sirf.Reg
            - sirf.SIRF
          pip_check: false  # skip sirf-contrib's optional deps (brainweb/docopt/matplotlib)
    about:
      summary: Synergistic Image Reconstruction Framework (CPU)
      homepage: https://github.com/SyneRBI/SIRF
      repository: https://github.com/SyneRBI/SIRF
      license: Apache-2.0
      license_file: LICENSE.txt
