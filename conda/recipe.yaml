# Usage:
#   rattler-build build -r conda -c conda-forge -c ismrmrd -c ccpi --target-platform {linux-64,osx-arm64,win-64} [--variant python=3.12]
# Channel includes:
# - ismrmrd::mrd-storage-server (gadgetron run dep; linux-64 + osx-64 only)
# - ccpi::cil (sirf run dep on linux/win; run-constrained on osx — no CIL 26 for osx)
# cuda: CONDA_OVERRIDE_CUDA={12.9,13.0,...} rattler-build -c nvidia ... (linux only)
# TODO:
# - [ ] conda-forge::sirf
# - [ ] conda-forge::gadgetron?
# - [ ] conda-forge::pet-rd-tools
#
# STIR 6.4.0 is consumed from conda-forge (cpu build); the version jump forces
# the rest of the stack up (ITK 5.4.7, ROOT 6.36.10, Boost 1.90, hdf5 1.14.6),
# which also unifies everything on icu 78. ismrmrd is built from source here
# because conda-forge has no pre-built ismrmrd for Boost 1.90.

schema_version: 1

context:
  boost: 1.92.0.*
  hdf5: 1.14.6
  cuda_version: ${{ env.get("CONDA_OVERRIDE_CUDA", default="None") }}
  with_cuda: ${{ "true" if cuda_version != "None" else "" }}
  cuda_major: ${{ (cuda_version | split(".") | first) if with_cuda else "0" }}
  cuda_build_prefix: ${{ "cuda" ~ (cuda_version | version_to_buildstring) if with_cuda else "cpu" }}
  c_cache_c: ${{ env.get("CMAKE_C_COMPILER_LAUNCHER", default="ccache") }}
  c_cache_cxx: ${{ env.get("CMAKE_CXX_COMPILER_LAUNCHER", default="ccache") }}
  ccache_dir: ${{ env.get("CCACHE_DIR", default="") }}
  ccache_maxsize: ${{ env.get("CCACHE_MAXSIZE", default="5G") }}

about:
  license: Apache-2.0
  license_family: Apache
  homepage: https://github.com/SyneRBI/SIRF-SuperBuild
  repository: https://github.com/SyneRBI/SIRF-SuperBuild

outputs:
  - package:
      name: ismrmrd
      version: "1.15.0"
    inherit: null
    source:
      git: https://github.com/ismrmrd/ismrmrd.git
      tag: v1.15.0
    build:
      number: 0
      # conda-forge STIR 6.4.0 needs Boost 1.90
      # but no compatible conda-forge ismrmrd exists
      script:
        content:
          - if: unix
            then: cmake -G Ninja $SRC_DIR -B $BUILD_PREFIX/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PREFIX -DCMAKE_PREFIX_PATH=$PREFIX -DBUILD_STATIC:BOOL=OFF -DBUILD_TESTS:BOOL=OFF -DBUILD_UTILITIES:BOOL=OFF -DBUILD_EXAMPLES:BOOL=OFF
          - if: win
            then: cmake -G Ninja "%SRC_DIR%" -B "%BUILD_PREFIX%/build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="%LIBRARY_PREFIX%" -DCMAKE_PREFIX_PATH="%LIBRARY_PREFIX%" -DBUILD_STATIC:BOOL=OFF -DBUILD_TESTS:BOOL=OFF -DBUILD_UTILITIES:BOOL=OFF -DBUILD_EXAMPLES:BOOL=OFF
          - if: unix
            then: cmake --build $BUILD_PREFIX/build --config Release
          - if: win
            then: cmake --build "%BUILD_PREFIX%/build" --config Release
          - if: unix
            then: cmake --install $BUILD_PREFIX/build --config Release
          - if: win
            then: cmake --install "%BUILD_PREFIX%/build" --config Release
        env:
          CMAKE_C_COMPILER_LAUNCHER: ${{ c_cache_c }}
          CMAKE_CXX_COMPILER_LAUNCHER: ${{ c_cache_cxx }}
          CCACHE_DIR: ${{ ccache_dir }}
          CCACHE_MAXSIZE: ${{ ccache_maxsize }}
    requirements:
      build:
        - ccache
        - cmake
        - ninja
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
      host:
        - fftw
        - hdf5 ==${{ hdf5 }}
        - libboost-devel ${{ boost }}
        - nlohmann_json
        - pugixml
      run:
        - fftw
        - hdf5 ~=${{ hdf5 }}
        - libboost-devel ${{ boost }}
        - pugixml
    tests:
      - script:
          - if: unix
            then: test -f $PREFIX/lib/cmake/ISMRMRD/ISMRMRDConfig.cmake
          - if: win
            then: if not exist "%LIBRARY_PREFIX%\lib\cmake\ISMRMRD\ISMRMRDConfig.cmake" exit 1
    about:
      summary: "ISMRMRD data format library"
      homepage: https://github.com/ismrmrd/ismrmrd
      license: LicenseRef-ISMRMRD
      license_file: LICENSE
      repository: https://github.com/ismrmrd/ismrmrd

  - package:
      name: siemens_to_ismrmrd
      version: "1.3.0"
    inherit: null
    source:
      git: https://github.com/ismrmrd/siemens_to_ismrmrd.git
      tag: v1.3.0
    build:
      number: 0
      script:
        content:
          - if: unix
            then: cmake -G Ninja $SRC_DIR -B $BUILD_PREFIX/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PREFIX -DBUILD_DYNAMIC:BOOL=ON
          - if: win
            then: cmake -G Ninja "%SRC_DIR%" -B "%BUILD_PREFIX%/build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="%LIBRARY_PREFIX%" -DBUILD_DYNAMIC:BOOL=ON
          - if: unix
            then: cmake --build $BUILD_PREFIX/build --config Release
          - if: win
            then: cmake --build "%BUILD_PREFIX%/build" --config Release
          - if: unix
            then: cmake --install $BUILD_PREFIX/build --config Release
          - if: win
            then: cmake --install "%BUILD_PREFIX%/build" --config Release
        env:
          CMAKE_C_COMPILER_LAUNCHER: ${{ c_cache_c }}
          CMAKE_CXX_COMPILER_LAUNCHER: ${{ c_cache_cxx }}
          CCACHE_DIR: ${{ ccache_dir }}
          CCACHE_MAXSIZE: ${{ ccache_maxsize }}
    requirements:
      build:
        - ccache
        - cmake
        - ninja
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
      host:
        - ${{ pin_subpackage('ismrmrd', exact=True) }}
        - libboost-devel ${{ boost }}
        - libxml2-devel
        - libxslt
      run:
        - ${{ pin_subpackage('ismrmrd') }}
        - libboost-devel ${{ boost }}
        - libxml2-devel
        - libxslt
    tests:
      - script:
          - siemens_to_ismrmrd --help
          - ismrmrd_to_siemens --help
    about:
      summary: "Siemens MR-PET raw data to ISMRMRD converter"
      homepage: https://github.com/ismrmrd/siemens_to_ismrmrd
      license: LicenseRef-siemens-to-ismrmrd
      license_file: LICENSE
      repository: https://github.com/ismrmrd/siemens_to_ismrmrd

  - package:
      name: gadgetron
      version: "4.7.2"
    source:
      git: https://github.com/SyneRBI/gadgetron.git
      # -Werror/cblas, boost>=1.90, CUDA BOOST_CURRENT_FUNCTION, Windows process
      # stub (+ Process::child id(), _popen/_pclose in capture_output), Sfndam
      # write() decl/def mismatch (Clang/macOS), portable execvpe-less exec,
      # NUL-terminated argv, Windows FindCBLAS direct netlib link,
      # ProcessHelper.h rename (MSVC <process.h> clash), MSVC lapack types,
      # libc++-safe BufferKey ordering
      rev: 0023ee1587a2f1010b38838d5d2fc615a91e0477
    build:
      number: 0
      string: ${{ cuda_build_prefix }}
      variant:
        use_keys:
          - ${{ "cuda" if with_cuda }}
        down_prioritize_variant: ${{ 0 if with_cuda else 1 }}
      script:
        file: ${{ "build-gadgetron.ps1" if win else "build-gadgetron.sh" }}
        env:
          cuda_compiler_version: ${{ cuda_version }}
          USE_CUDA: ${{ 'ON' if with_cuda else 'OFF' }}
          CMAKE_C_COMPILER_LAUNCHER: ${{ c_cache_c }}
          CMAKE_CXX_COMPILER_LAUNCHER: ${{ c_cache_cxx }}
          CCACHE_DIR: ${{ ccache_dir }}
          CCACHE_MAXSIZE: ${{ ccache_maxsize }}
    requirements:
      build:
        - ccache
        - cmake
        - ninja
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - if: with_cuda
          then: ${{ compiler('cuda') }}
      host:
        # armadillo 12 (libar2) — Gadgetron 4.7 requires Armadillo 12+.
        - armadillo >=12,<13
        - libboost-devel ${{ boost }}
        - fftw
        - hdf5 ==${{ hdf5 }}
        - howardhinnant_date
        - ${{ pin_subpackage('ismrmrd', exact=True) }}
        # BLAS/LAPACK pinned to the netlib 3.11.0 builds (see comment in sirf).
        - libblas 3.11.0.* *_netlib
        - libcblas 3.11.0.* *_netlib
        - libcurl
        - if: linux
          then: libgomp
        - if: osx
          then: llvm-openmp
        - liblapack 3.11.0.* *_netlib
        - liblapacke 3.11.0.* *_netlib
        - nlohmann_json
        - pugixml
        - range-v3
        - if: with_cuda
          then:
            - cuda-version ==${{ cuda_version }}
            - if: (cuda_major | int) >= 12
              then: cuda-cudart-dev
            # GPU toolbox links the CUDA math libs; -dev ships the headers,
            # and each build pins its own cuda-version so the solver picks
            # the matching CUDA (e.g. libcufft 11.4 for 12.9).
            - libcublas-dev
            - libcufft-dev
            - libcusparse-dev
      run:
        - armadillo >=12,<13
        - libboost-devel ${{ boost }}
        - fftw
        - hdf5 ~=${{ hdf5 }}
        - howardhinnant_date
        - ${{ pin_subpackage('ismrmrd') }}
        - libblas 3.11.0.* *_netlib
        - libcblas 3.11.0.* *_netlib
        - libcurl
        - if: linux
          then: libgomp
        - if: osx
          then: llvm-openmp
        - liblapack 3.11.0.* *_netlib
        - liblapacke 3.11.0.* *_netlib
        # ismrmrd channel: linux-64 + osx-64 only
        - if: target_platform == "linux-64" or target_platform == "osx-64"
          then: mrd-storage-server
        - nlohmann_json
        - pugixml
        - range-v3
        - if: with_cuda
          then:
            - __cuda
            - cuda-version ~=${{ cuda_version }}
            - cuda-cudart
            - libcublas
            - libcufft
            - libcusparse
            - libcurand
      ignore_run_exports:
        by_name:
          - if: with_cuda
            then:
              - cuda-version
              - cuda-cudart-dev
    tests:
      - script:
          - if: unix
            then: test -x $PREFIX/bin/gadgetron
          - if: unix
            then: test -x $PREFIX/bin/gadgetron_ismrmrd_client
          - if: unix
            then: test -f $PREFIX/lib/libgadgetron_core.so -o -f $PREFIX/lib/libgadgetron_core.dylib -o -f $PREFIX/lib/libgadgetron_core.a
          - if: win
            then: if not exist "%LIBRARY_PREFIX%\bin\gadgetron.exe" exit 1
          - if: win
            then: if not exist "%LIBRARY_PREFIX%\bin\gadgetron_ismrmrd_client.exe" exit 1
          - if: win
            then: if not exist "%LIBRARY_PREFIX%\bin\gadgetron_core.dll" exit 1
    about:
      summary: "Gadgetron MR image reconstruction framework (CPU-only, SyneRBI fork)"
      # Custom “GADGETRON SOFTWARE LICENSE V1.0” (NIH public-domain-style), not Apache-2.0
      license: LicenseRef-GADGETRON
      license_file: LICENSE
      repository: https://github.com/SyneRBI/gadgetron

  - package:
      name: pet-rd-tools
      version: "2.0.2"
    source:
      git: https://github.com/SyneRBI/pet-rd-tools.git
      # Fork of UCL/pet-rd-tools @ v2.0.2 (branch win-compat): Windows
      # portability — glog severity is google::GLOG_INFO (not google::INFO),
      # and log streams use path.string() (narrow) instead of path.native()
      # (std::wstring on Windows, no narrow operator<<).
      rev: 9413dda8ac5f44f6d9346a2c121a366a92ad3ba4
    build:
      number: 0
      script:
        content:
          - if: unix
            then: cmake -G Ninja $SRC_DIR -B $BUILD_PREFIX/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PREFIX -DCMAKE_PREFIX_PATH=$PREFIX -DBUILD_TESTING:BOOL=OFF
          - if: win
            then: cmake -G Ninja "%SRC_DIR%" -B "%BUILD_PREFIX%/build" -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="%LIBRARY_PREFIX%" -DCMAKE_PREFIX_PATH="%LIBRARY_PREFIX%" -DBUILD_TESTING:BOOL=OFF
          - if: unix
            then: cmake --build $BUILD_PREFIX/build --config Release
          - if: win
            then: cmake --build "%BUILD_PREFIX%/build" --config Release
          - if: unix
            then: cmake --install $BUILD_PREFIX/build --config Release
          - if: win
            then: cmake --install "%BUILD_PREFIX%/build" --config Release
        env:
          CMAKE_C_COMPILER_LAUNCHER: ${{ c_cache_c }}
          CMAKE_CXX_COMPILER_LAUNCHER: ${{ c_cache_cxx }}
          CCACHE_DIR: ${{ ccache_dir }}
          CCACHE_MAXSIZE: ${{ ccache_maxsize }}
    requirements:
      build:
        - ccache
        - cmake
        - ninja
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
      host:
        - libboost-devel ${{ boost }}
        - glog
        - libitk ==5.4.7
        - libitk-devel ==5.4.7
      run:
        - libboost-devel ${{ boost }}
        - glog
        - libitk ~=5.4.7
    tests:
      - script:
          - if: unix
            then: test -x $PREFIX/bin/nm_validate
          - if: win
            then: if not exist "%LIBRARY_PREFIX%\bin\nm_validate.exe" exit 1
    about:
      summary: "PET Raw Data (rd) tools"
      homepage: https://github.com/UCL/pet-rd-tools
      license: Apache-2.0
      license_file: LICENSE.txt
      repository: https://github.com/UCL/pet-rd-tools

  - package:
      name: sirf
      version: "3.10.1"
    source:
      git: https://github.com/SyneRBI/SIRF.git
      # Boost 1.90 asio fix + optional STIR-shim hook (SyneRBI/SIRF PR #1420, branch boost190-asio)
      # + Windows stat() portability + GeometricalInfo.h <cmath> (libc++) +
      # Apple: skip the cGadgetron C++ test + Windows FindFFTW3 (conda-forge
      # fftw import libs are <name>.lib, no 'lib' prefix)
      rev: 42f3ce079e90b0504a6f01e5cba7043fd0d03b84
    build:
      number: 0
      string: py${{ python | replace('.', '') }}${{ '_' ~ cuda_build_prefix if with_cuda else '' }}
      variant:
        use_keys:
          - ${{ "cuda" if with_cuda }}
        down_prioritize_variant: ${{ 0 if with_cuda else 1 }}
      script:
        file: ${{ "build-sirf.ps1" if win else "build-sirf.sh" }}
        env:
          cuda_compiler_version: ${{ cuda_version }}
          GADGETRON_USE_CUDA: ${{ 'ON' if with_cuda else 'OFF' }}
          CMAKE_C_COMPILER_LAUNCHER: ${{ c_cache_c }}
          CMAKE_CXX_COMPILER_LAUNCHER: ${{ c_cache_cxx }}
          CCACHE_DIR: ${{ ccache_dir }}
          CCACHE_MAXSIZE: ${{ ccache_maxsize }}
    requirements:
      build:
        - ccache
        - cmake
        - git
        - ninja
        - pip
        - swig
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - if: with_cuda
          then: ${{ compiler('cuda') }}
      host:
        - ${{ pin_subpackage('gadgetron', exact=True) }}
        - ${{ pin_subpackage('pet-rd-tools', exact=True) }}
        # STIR from conda-forge (static libs, linked into _pystir.so). STIR 6.4.0 has no
        # CUDA build on conda-forge, so the CUDA variant uses the 6.3.0 CUDA build.
        - if: with_cuda
          then:
            - stir 6.3.0.* ${{ cuda_build_prefix }}*
          else:
            - stir 6.4.0.*
        - libboost-devel ${{ boost }}
        - fftw
        - hdf5 ==${{ hdf5 }}
        - ${{ pin_subpackage('ismrmrd', exact=True) }}
        - niftyreg
        - numpy >=2,<3
        - pip
        - python
        - setuptools  # pip runs without build isolation (see build-sirf.sh); the cpython-split python pkgs don't pull it in
        - if: with_cuda
          then:
            - cuda-version ==${{ cuda_version }}
            - if: (cuda_major | int) >= 12
              then: cuda-cudart-dev
            # cGadgetron links the CUDA math libs (headers via -dev).
            - libcublas-dev
            - libcufft-dev
            - libcusparse-dev
      run:
        - libboost-devel ${{ boost }}
        - array-api-compat
        # CIL (the Python regulariser) has no osx builds — optional (run-constrained) there
        - if: not osx
          then: cil >=26
        - ${{ pin_subpackage('gadgetron') }}
        - ${{ pin_subpackage('pet-rd-tools') }}
        - if: with_cuda
          then:
            - stir 6.3.0.* ${{ cuda_build_prefix }}*
          else:
            - stir 6.4.0.*
        - deprecation
        - fftw
        - hdf5 ~=${{ hdf5 }}
        - ${{ pin_subpackage('ismrmrd') }}
        - niftyreg
        - numpy >=2,<3
        - pip
        - python
        - if: with_cuda
          then:
            - __cuda
            - cuda-version ~=${{ cuda_version }}
            - cuda-cudart
            - libcublas
            - libcufft
            - libcusparse
            - libcurand
            # CUDA regulariser (the GPU CIL) for the GPU variant.
            - ccpi-regulariser >=26 cuda${{ cuda_major }}*
      run_constraints:
        - ${{ pin_subpackage('siemens_to_ismrmrd') }}
        - if: osx
          then: cil >=26
      ignore_run_exports:
        by_name:
          - if: with_cuda
            then:
              - cuda-version
              - cuda-cudart-dev
    tests:
      - script:
          # Import each module in its own process so a crash in one is isolated
          # and identified (a single-process import would abort the whole test
          # without saying which module faulted).
          - python -c "import sirf; print('sirf OK')"
          - python -c "import sirf.contrib; print('sirf.contrib OK')"
          # macOS: the sirf.STIR import segfaults (runtime crash in the STIR
          # module); run it under lldb to capture a backtrace of the fault.
          - if: osx
            then: lldb -b -o "run" -o "bt 40" -o "register read x0 x1 x2 x3" -o "quit" -- python -c "import sirf.STIR; print('sirf.STIR OK')"
          - if: not osx
            then: python -c "import sirf.STIR; print('sirf.STIR OK')"
          - python -c "import sirf.Utilities; print('sirf.Utilities OK')"
          - python -c "import sirf.Reg; print('sirf.Reg OK')"
          - python -c "import sirf.SIRF; print('sirf.SIRF OK')"
          - if: unix
            then: python -c "import sirf.Gadgetron; print('sirf.Gadgetron OK')"
    about:
      summary: Synergistic Image Reconstruction Framework (CPU)
      homepage: https://github.com/SyneRBI/SIRF
      repository: https://github.com/SyneRBI/SIRF
      license: Apache-2.0
      license_file: LICENSE.txt
