name: conda
on:
  push: &triggers
    branches: [master]
    tags: ['v**']
    paths:
    - 'conda/**'
    - '.github/workflows/conda.yml'
  pull_request: *triggers
  workflow_dispatch:

defaults: {run: {shell: 'bash -el {0}'}}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        python: [3.11, 3.12, 3.13]
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 3G
    steps:
    - uses: actions/checkout@v7
    - uses: jlumbroso/free-disk-space@v2
      with: {large-packages: false}
    - name: Cache rattler # conda, git, repodata
      uses: actions/cache@v6
      with:
        path: ~/.cache/rattler
        key: rattler-${{ runner.os }}-${{ hashFiles('conda/recipe.yaml') }}
        restore-keys: rattler-${{ runner.os }}-
    - name: Cache ccache
      uses: actions/cache@v6
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ runner.os }}-py${{ matrix.python }}-${{ hashFiles('conda/recipe.yaml', 'conda/build-*.sh') }}
        restore-keys: ccache-${{ runner.os }}-
    - uses: prefix-dev/rattler-build-action@v0.2.39
      with:
        recipe-path: conda/recipe.yaml
        rattler-build-version: v0.76.1
        # --no-build-id: required for ccache
        build-args: --target-platform linux-64 -c conda-forge -c ismrmrd -c ccpi --variant python=${{ matrix.python }} --no-build-id
        artifact-name: conda-py${{ matrix.python }}-linux-64
    - name: ccache stats
      if: always()
      run: conda install -yq conda-forge::ccache && ccache -s || true
    - if: failure()
      name: Upload debug build logs
      uses: actions/upload-artifact@v7
      with:
        name: conda-build-logs-py${{ matrix.python }}
        path: output/bld
        retention-days: 7
  build-cuda:
    name: "cuda py${{ matrix.python }} cuda${{ matrix.cuda }}"
    runs-on: [self-hosted, cuda]
    timeout-minutes: 300
    strategy:
      fail-fast: false
      # min & max
      matrix:
        include:
        - python: "3.11"
          cuda: "12.9"
        - python: "3.13"
          cuda: "13.0" # TODO: bump after stir>=6.4
    env:
      CONDA_OVERRIDE_CUDA: ${{ matrix.cuda }}
    steps:
    - uses: actions/checkout@v7
    - uses: prefix-dev/rattler-build-action@v0.2.39
      with:
        recipe-path: conda/recipe.yaml
        rattler-build-version: v0.76.1
        # --no-build-id: required for ccache
        # cuda_compiler_version matches CONDA_OVERRIDE_CUDA so compiler('cuda')
        # resolves to the real cuda-nvcc_linux-64 package (see variants.yaml).
        build-args: --target-platform linux-64 -c conda-forge -c ismrmrd -c ccpi -c nvidia --variant python=${{ matrix.python }} --variant cuda_compiler_version=${{ matrix.cuda }} --no-build-id
        artifact-name: conda-py${{ matrix.python }}-cu${{ matrix.cuda }}-linux-64
    - name: ccache stats
      if: always()
      run: ccache -s || true
    - if: failure()
      name: Upload debug build logs
      uses: actions/upload-artifact@v7
      with:
        name: conda-build-logs-py${{ matrix.python }}-cu${{ matrix.cuda }}
        path: output/bld
        retention-days: 7
