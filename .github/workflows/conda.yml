name: conda
on:
  push: &triggers
    branches: [master]
    tags: ['v**']
    paths:
    - 'conda/**'
    - '.github/workflows/conda.yml'
  pull_request: *triggers
  workflow_dispatch:

defaults: {run: {shell: 'bash -el {0}'}}
jobs:
  build:
    runs-on: ${{ matrix.os }}-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu, macos, windows]
        python: [3.11, 3.13]
    env:
      CCACHE_DIR: ${{ github.workspace }}${{ matrix.os == 'windows' && '\' || '/' }}.ccache
      CCACHE_MAXSIZE: 3G
      RATTLER_CACHE_DIR: ${{ github.workspace }}${{ matrix.os == 'windows' && '\' || '/' }}.rattler
    steps:
    - uses: actions/checkout@v7
    - name: Cache rattler # conda, git, repodata
      uses: actions/cache@v6
      with:
        path: ${{ env.RATTLER_CACHE_DIR }}
        key: rattler-${{ runner.os }}-${{ hashFiles('conda/recipe.yaml') }}
        restore-keys: rattler-${{ runner.os }}-
    - name: Cache ccache
      uses: actions/cache@v6
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ccache-${{ runner.os }}-py${{ matrix.python }}-${{ hashFiles('conda/recipe.yaml', 'conda/build-*') }}
        restore-keys: ccache-${{ runner.os }}-
    - name: config
      id: config
      run: |
        # avoid "hardlink different from source"
        git config --global core.commitGraph false
        # ratter-build config
        case ${{ matrix.os }} in
          windows)
            echo target=win-64 >> $GITHUB_OUTPUT
            ;;
          macos)
            echo target=osx-arm64 >> $GITHUB_OUTPUT
            ;;
          *)
            echo target=linux-64 >> $GITHUB_OUTPUT
            ;;
        esac
    - uses: prefix-dev/rattler-build-action@v0.2.39
      with:
        recipe-path: conda/recipe.yaml
        rattler-build-version: v0.76.1
        # --no-build-id: required for ccache
        build-args: --target-platform ${{ steps.config.outputs.target }} -c conda-forge -c ismrmrd -c ccpi --variant python=${{ matrix.python }} --no-build-id
        artifact-name: conda-py${{ matrix.python }}-${{ steps.config.outputs.target }}
    - if: failure()
      name: Upload debug build logs
      uses: actions/upload-artifact@v7
      with:
        name: conda-build-logs-py${{ matrix.python }}-${{ matrix.os }}
        path: output/bld
        retention-days: 7
  build-cuda:
    name: "cuda py${{ matrix.python }} cuda${{ matrix.cuda }}"
    runs-on: [self-hosted, cuda]
    timeout-minutes: 300
    strategy:
      fail-fast: false
      # min & max
      matrix:
        include:
        - python: "3.11"
          cuda: "12.9"
        - python: "3.13"
          cuda: "13.4"
    steps:
    - uses: actions/checkout@v7
    - uses: prefix-dev/rattler-build-action@v0.2.39
      with:
        recipe-path: conda/recipe.yaml
        rattler-build-version: v0.76.1
        # --no-build-id: required for ccache
        build-args: --target-platform linux-64 -c conda-forge -c ismrmrd -c ccpi -c nvidia --variant python=${{ matrix.python }} --variant cuda_compiler_version=${{ matrix.cuda }} --no-build-id
        artifact-name: conda-py${{ matrix.python }}-cu${{ matrix.cuda }}-linux-64
    - name: ccache stats
      if: always()
      run: ccache -s || true
    - if: failure()
      name: Upload debug build logs
      uses: actions/upload-artifact@v7
      with:
        name: conda-build-logs-py${{ matrix.python }}-cu${{ matrix.cuda }}
        path: output/bld
        retention-days: 7
